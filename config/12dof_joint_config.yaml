# NOTE: this file's top-level joint key order is load-bearing -- MJ_Interface
# and PVT_Ctr both read it via yaml-cpp (which preserves file order) WITHOUT
# re-sorting, and that becomes each class's canonical joint index order. It
# must exactly match the joint declaration order in
# models/urdf/biped_robot_12dof.urdf, which RobotWrapper/Pinocchio uses as
# its own joint order -- otherwise joint index i here will not refer to the
# same physical joint as index i in RobotWrapper's q/dq. If you add/reorder
# joints here, reorder them identically in the URDF (or vice versa).
